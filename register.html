<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register-Greenshop</title>
    <link rel="stylesheet" href="./css/form.css" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
  </head>

  <body>
    <header class="form-header">
      <div class="container">
        <a href="./login.html">Login</a> |
        <a class="active-link" href="./register.html">Register</a>
      </div>
    </header>

    <main>
      <div class="container">
        <a class="home-link" href="./index.html">
          <span>&times;</span>
        </a>
        <div class="form-section">
          <form>
            <p class="form-description">Enter your information to register.</p>

            <input
              class="form-input"
              type="text"
              name="username"
              placeholder="Username"
            />
            <br />

            <input
              class="form-input"
              type="email"
              name="email"
              placeholder="Enter your email address"
            />
            <br />

            <input
              class="form-input"
              type="password"
              name="password"
              placeholder="Password"
            />
            <br />

            <input
              class="form-input"
              type="password"
              name="confirm-password"
              placeholder="Confirm Password"
            />
            <br />

            <button class="button form-button" type="submit">Register</button>
          </form>

          <p class="divider">Or log in with</p>
          <hr />

          <button class="social-button" type="button">
            <img src="./images/google.png" alt="Google" />
            Continue with Google
          </button>
          <br />

          <button class="social-button" type="button">
            <img src="./images/facebook.png" alt="Facebook" />
            Continue with Facebook
          </button>
        </div>
      </div>
    </main>
    <footer class="register-footer"></footer>
  </body>
</html>
