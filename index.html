<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenshop</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <header class="header container">
      <img src="./images/Logo.png" alt="Greenshop Logo" />

      <ul class="menu">
        <li><a href="#">Home</a></li>
        <li><a href="#">Shop</a></li>
        <li><a href="#">Plant Care</a></li>
        <li><a href="#">Blogs</a></li>
      </ul>

      <img src="./images/Vector.svg" alt="Vector" />
      <img src="./images/Group.svg" alt="Group" />

      <button class="login-button">
        <img src="./images/Logout.svg" alt="Login" />
        Login
      </button>
    </header>

    <section class="hero container">
      <div class="wrapper">
        <p class="hero-welcome">Welcome to GreenShop</p>
        <h1 class="hero-heading">
          Let’s Make a Better <span class="accent">Planet</span>
        </h1>
        <p class="hero-description">
          We are an online plant shop offering a wide range of cheap and trendy
          plants. Use our plants to create an unique Urban Jungle. Order your
          favorite plants!
        </p>

        <button class="hero-button">SHOP NOW</button>
      </div>
      <img src="./images/flowers.png" alt="flowers" />
    </section>
  </body>
</html>
