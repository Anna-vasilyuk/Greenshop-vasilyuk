<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenshop</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <header class="header container">
      <a href="./index.html">
        <img src="./images/Logo.png" alt="Greenshop Logo" />
      </a>
      <nav>
        <ul class="menu">
          <li><a href="#">Home</a></li>
          <li><a href="#">Shop</a></li>
          <li><a href="#">Plant Care</a></li>
          <li><a href="#">Blogs</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <img src="./images/Vector.svg" alt="" />
        <img src="./images/Group.svg" alt="" />

        <a class="login-button" href="./login.html">
          <img src="./images/Logout.svg" alt="" />
          Login
        </a>
      </div>
    </header>

    <main>
      <section class="hero container">
        <div class="wrapper">
          <p class="hero-welcome">Welcome to GreenShop</p>
          <h1 class="hero-heading">
            Let’s Make a Better <span class="accent">Planet</span>
          </h1>
          <p class="hero-description">
            We are an online plant shop offering a wide range of cheap and
            trendy plants. Use our plants to create an unique Urban Jungle.
            Order your favorite plants!
          </p>

          <a class="hero-button" href="#">SHOP NOW</a>
        </div>
        <img class="hero-image" src="./images/flowers.png" alt="Green plants" />
      </section>

      <section class="products">
        <div class="container">
          <aside class="sidebar"></aside>

          <div class="content"></div>
        </div>
      </section>
    </main>
  </body>
</html>
